<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#31536c"/></marker><style>text{font-family:Arial,sans-serif;fill:#18344d}.h{font-size:38px;font-weight:700}.t{font-size:27px;font-weight:650}.s{font-size:22px}.arr{fill:none;stroke:#31536c;stroke-width:7;marker-end:url(#a)}</style></defs>
<rect width="1500" height="620" rx="28" fill="#f5f9fc"/><text x="750" y="60" class="h" text-anchor="middle">Передача данных на LCD1602 через адаптер PCF8574</text>
