<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#263f56"/></marker><style>text{font-family:Arial,sans-serif;fill:#18344d}.h{font-size:39px;font-weight:700}.t{font-size:27px;font-weight:650}.s{font-size:22px}.line{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}</style></defs>
